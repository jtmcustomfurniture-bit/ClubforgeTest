

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>ClubForge Calendar Test</title>
</head>
<body>
    <h1>ClubForge Calendar Integration Test</h1>
    <p>Testing the embedded tournament calendar.</p>

<iframe id="clubforge-calendar" src="https://clubforgegolf.com/site/ahmgc/calendar/embed" title="Tournament Calendar" width="100%" height="800" style="border:0" loading="lazy"></iframe>
<script>
  (function () {
    const frame = document.getElementById('clubforge-calendar');
    const url = new URL(frame.src);
    url.searchParams.set('embedHost', window.location.href);
    frame.src = url.toString();
  })();
</script>
</body>
</html>
